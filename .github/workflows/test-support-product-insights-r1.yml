name: Test Support Product Insights R1
on:
  push:
    branches: [support-product-insights-r1]
    paths:
      - 'support_center/**'
      - '.github/workflows/test-support-product-insights-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: 'ci-only-secret-key-not-production'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      DJANGO_SECURE_SSL_REDIRECT: '0'
      DJANGO_HSTS_SECONDS: '0'
      RSJC_CORPORATE_OPERATOR_TOKEN: 'test-operator-token'
      RSJC_WORKSPACE_ID: 'ws_test'
      RSJC_SUPPORT_INGEST_ENABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip 'Django==5.2.11' 'django-csp>=4,<5'
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test corporate support_center -v 2
      - name: Product telemetry privacy contract
        run: |
          python - <<'PY'
          from pathlib import Path
          ingest=Path('support_center/product_ingest.py').read_text()
          insights=Path('support_center/product_insights.py').read_text()
          urls=Path('support_center/urls.py').read_text()
          page=Path('support_center/templates/support_center/product_insights.html').read_text()
          assert 'sanitize_product_detail' in ingest
          assert '_PRODUCT_LABEL_KEYS' in ingest and '_PRODUCT_INT_KEYS' in ingest and '_PRODUCT_BOOL_KEYS' in ingest
          assert 'speechText' not in ingest and 'customerName' not in ingest
          assert 'detail.operation' not in insights  # Python reads the sanitized JSON dictionary only.
          assert 'operation.startswith("ux_")' in insights
          assert 'management_action_rate' in insights
          assert 'quick_register_rate' in insights
          assert 'avg_backtracks' in insights
          assert 'product_ingest.api_events' in urls
          assert 'product_insights.dashboard' in urls
          assert 'não armazenamos o texto pesquisado' in page
          assert 'Não recebe nome, telefone, endereço, valor de orçamento' in page
          PY
