name: Test Reparos SJC Support R1
on:
  push:
    branches: [support-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: 'ci-only-secret-key-not-production'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      DJANGO_SECURE_SSL_REDIRECT: '0'
      DJANGO_HSTS_SECONDS: '0'
      RSJC_CORPORATE_OPERATOR_TOKEN: 'test-operator-token'
      RSJC_WORKSPACE_ID: 'ws_test'
      RSJC_SUPPORT_INGEST_ENABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip 'Django==5.2.11' 'django-csp>=4,<5'
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test corporate support_center -v 2
      - name: Support security contract checks
        run: |
          python - <<'PY'
          from pathlib import Path
          settings=Path('config/settings.py').read_text()
          views=Path('support_center/views.py').read_text()
          services=Path('support_center/services.py').read_text()
          models=Path('support_center/models.py').read_text()
          urls=Path('support_center/urls.py').read_text()
          tests=Path('support_center/tests.py').read_text()
          offline=Path('support_center/offline.py').read_text()
          dashboard=Path('support_center/templates/support_center/dashboard.html').read_text()
          account=Path('support_center/templates/support_center/account.html').read_text()
          assert 'RSJC_SUPPORT_INGEST_ENABLED' in settings
          assert '"1" if DEBUG else "0"' in settings
          assert 'staff_member_required' in views
          assert 'X-Support-Device-Token' in views
          assert 'secrets.compare_digest' in views
          assert 'PayloadTooLarge' in views and 'too many requests' in views
          assert 'api_consent' in views and 'api_consent' in urls
          assert 'SupportAccessLog' in views and 'SupportAccessLog' in models
          assert 'account_key' in models
          assert 'workspace_id = models.CharField(max_length=100, blank=True, default="", db_index=True)' in models
          assert 'token_hash = models.CharField(max_length=64, unique=True, db_index=True)' in models
          assert 'DeviceAlreadyRegistered' in services
          assert 'prune_device_data' in services
          assert 'stackSignature' in services
          allowed=services.split('_ALLOWED_DETAIL_KEYS = {',1)[1].split('}',1)[0]
          assert '"message"' not in allowed and '"stack"' not in allowed and '"reason"' not in allowed
          assert 'corporateLastErrorCode' in services and '"corporateLastError"' not in services.split('"sync": pick',1)[1].split(')',1)[0]
          assert 'clientName' not in services
          assert 'photos' not in models.lower()
          assert 'ReparosSJC_Support_Diagnostic' in offline
          assert 'sanitize_snapshot' in offline and 'sanitize_detail' in offline
          assert 'offline_import' in views and 'offline_import' in urls
          assert 'multipart/form-data' in dashboard and '1 MB' in dashboard
          assert 'filters' in account and 'severity' in account and 'period' in account
          assert 'test_support_account_is_not_keyed_by_workspace' in tests
          assert 'test_existing_device_requires_current_token_to_rotate' in tests
          assert 'test_payload_limit_rejects_oversized_bootstrap' in tests
          assert 'test_staff_can_import_sanitized_offline_diagnostic' in tests
          assert 'test_timeline_filters_by_severity_action_and_period' in tests
          print('Support R1 hardening security/static gate OK')
          PY
