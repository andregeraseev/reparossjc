name: Test Reparos SJC Corporate API R1
on:
  push:
    branches: [corporate-api-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: 'ci-only-secret-key-not-production'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      DJANGO_SECURE_SSL_REDIRECT: '0'
      DJANGO_HSTS_SECONDS: '0'
      RSJC_CORPORATE_OPERATOR_TOKEN: 'test-operator-token'
      RSJC_WORKSPACE_ID: 'ws_test'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip 'Django==5.2.11'
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test corporate -v 2
      - name: Security/static contract checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('config/settings.py').read_text()
          v=Path('corporate/views.py').read_text()
          a=Path('corporate/auth.py').read_text()
          assert 'DJANGO_SECRET_KEY' in s and 'CORPORATE_OPERATOR_TOKEN' in s
          assert 'django-insecure-' not in s
          assert 'ReparosSJC_Corporate_Request' in Path('corporate/services.py').read_text()
          assert 'hmac.compare_digest' in a
          assert 'privateAgenda' not in v
          print('Corporate API R1 static gate OK')
          PY
