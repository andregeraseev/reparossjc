name: Test Reparos SJC Portals v18.30
on:
  push:
    branches: [corporate-portals-v18.30-r1, qa-v18.30-portals-regression-r2-clean, v18.31-stability-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: 'ci-only-secret-key-not-production'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      DJANGO_SECURE_SSL_REDIRECT: '0'
      DJANGO_HSTS_SECONDS: '0'
      RSJC_CORPORATE_OPERATOR_TOKEN: 'test-operator-token'
      RSJC_WORKSPACE_ID: 'ws_test'
      RSJC_PORTAL_CRIS_TESTE_PASSWORD: 'ci-only-cris-password'
      RSJC_PORTAL_AMIL_JURIDICO_PASSWORD: 'ci-only-juridico-password'
      RSJC_PORTAL_AMIL_MANUTENCAO_PASSWORD: 'ci-only-manutencao-password'
      RSJC_PORTAL_AMIL_DISTRATO_PASSWORD: 'ci-only-distrato-password'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip 'Django==5.2.11' 'django-csp>=4,<5'
      - run: python -m compileall corporate support_center
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test corporate support_center -v 2
      - run: python manage.py migrate --noinput
      - name: Bootstrap four v18.30 portals smoke test
        run: |
          python manage.py bootstrap_v1830_portals
          python manage.py bootstrap_v1830_portals
      - name: v18.30 static privacy, compatibility and scope gate
        run: |
          python - <<'PY'
          from pathlib import Path
          models=Path('corporate/portal_v1830_models.py').read_text()
          flow=Path('corporate/portal_v1830.py').read_text()
          dispatch=Path('corporate/portal_dispatch_v1830.py').read_text()
          bootstrap=Path('corporate/management/commands/bootstrap_v1830_portals.py').read_text()
          template=Path('corporate/templates/corporate/portal_v1830.html').read_text()
          monitor=Path('support_center/portal_monitor_v1830.py').read_text()
          review=Path('support_center/review2.py').read_text()
          assert 'PortalChannelMembership' in models and 'PortalPerson' in models
          assert '_scopes(user)' in flow and 'portal_channel_id__in=allowed_ids' in flow
          assert 'personId' in flow and 'portal_person_id' in flow
          assert 'legacy_views.portal_home' in dispatch and 'legacy_views.portal_create' in dispatch
          assert 'PortalChannelMembership.objects.filter' in dispatch
          assert 'RSJC_PORTAL_AMIL_JURIDICO_PASSWORD' in bootstrap
          assert 'password' not in template.lower()
          assert 'dados não entram na telemetria' in template.lower()
          assert 'sanitize_snapshot_v1830' in review
          assert 'aggregate-technical-only' in monitor
          for forbidden_key in ('"clientName"','"requesterName"','"phone"','"address"','"description"','"imageUrl"'):
              assert forbidden_key not in monitor, forbidden_key
          print('v18.30 portal isolation/privacy/compatibility/monitoring gate OK')
          PY

  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validar produção externamente sem autenticação e sem mutação
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.reparossjc.online'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          request() {
            local name="$1" url="$2"
            curl --silent --show-error --max-time 20 \
              -D "$tmp/${name}.headers" -o "$tmp/${name}.body" \
              -w '%{http_code}' "$url"
          }

          login_code=$(request login "$base/corporativo/login/")
          test "$login_code" = '200'
          ! grep -qiE 'server error|traceback|internal server error' "$tmp/login.body"

          health_code=$(request health "$base/api/corporate/v1/health")
          test "$health_code" = '200'
          ! grep -qiE 'server error|traceback|internal server error' "$tmp/health.body"

          for spec in \
            'cris:/corporativo/p/cris-teste/teste/' \
            'juridico:/corporativo/p/amil/juridico/' \
            'manutencao:/corporativo/p/amil/manutencao/' \
            'distrato:/corporativo/p/amil/distrato/' \
            'portal_root:/corporativo/' \
            'support_feed:/suporte/monitoramento/portal-ops.json'
          do
            name=${spec%%:*}
            path=${spec#*:}
            code=$(request "$name" "$base$path")
            case "$code" in
              301|302|303|307|308) ;;
              *)
                echo "Unexpected anonymous status for $name: $code" >&2
                head -c 500 "$tmp/${name}.body" >&2 || true
                exit 1
                ;;
            esac
            ! grep -qiE 'server error|traceback|internal server error' "$tmp/${name}.body"
            location=$(awk 'BEGIN{IGNORECASE=1} /^Location:/{gsub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$tmp/${name}.headers")
            test -n "$location"
            printf '%s status=%s redirect=%s\n' "$name" "$code" "$location"
          done

          echo 'v18.30 external anonymous production smoke OK; no credentials or mutations used'
