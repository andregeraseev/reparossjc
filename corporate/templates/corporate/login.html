<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal corporativo • Reparos SJC</title><style>:root{--navy:#153845;--gold:#D2A83A;--bg:#F4F6F7;--text:#17313b;--muted:#667780}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,430px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #15384520}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:48px;height:48px;border-radius:15px;background:var(--navy);display:grid;place-items:center;color:var(--gold);font-weight:900}.brand strong{display:block;font-size:20px}.brand span{color:var(--muted);font-size:13px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #d8e0e3;border-radius:12px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.errorlist{color:#a12d2d;padding-left:18px}small{color:var(--muted)}</style></head><body><main class="card"><div class="brand"><div class="mark">RS</div><div><strong>Reparos SJC</strong><span>Portal corporativo</span></div></div><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label for="id_username">Usuário</label>{{ form.username }}<label for="id_password">Senha</label>{{ form.password }}<button type="submit">Entrar</button>{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}</form><p><small>Acesso exclusivo para empresas cadastradas.</small></p></main></body></html>
