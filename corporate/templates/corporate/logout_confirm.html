<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sair • Reparos SJC</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f7;color:#17313b;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(92vw,420px);background:#fff;border-radius:20px;padding:26px;box-shadow:0 18px 55px #15384520}h1{margin:0 0 8px;font-size:22px}p{color:#667780}.actions{display:flex;gap:10px;margin-top:20px}.actions form{margin:0}.btn,a{display:inline-block;border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.btn{background:#153845;color:#fff}a{background:#eef3f4;color:#153845}</style></head><body><main class="card"><h1>Sair do portal?</h1><p>Confirme para encerrar esta sessão.</p><div class="actions"><form method="post" action="{% url 'corporate:logout' %}">{% csrf_token %}<button class="btn" type="submit">Sair</button></form><a href="{% url 'corporate:portal' %}">Cancelar</a></div></main></body></html>
