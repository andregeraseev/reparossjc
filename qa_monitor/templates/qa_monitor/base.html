<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Testes · Reparos SJC{% endblock %}</title>
<style>
:root{color-scheme:light;font:16px/1.55 system-ui,sans-serif;color:#173447;background:#f3f6f8}
body{margin:0} header{background:#123143;color:white;padding:1rem max(1rem,calc((100% - 65rem)/2));display:flex;align-items:center;justify-content:space-between;gap:1rem}
main{max-width:65rem;margin:2rem auto;padding:0 1rem} h1{line-height:1.2;font-size:2rem;margin:0 0 1rem}
a{color:#00567a} button{background:#00567a;color:white;padding:.55rem .85rem;border:0;border-radius:.3rem;font:inherit;cursor:pointer}
header button{background:#294c61}.card{background:white;border:1px solid #d2dde5;border-radius:.55rem;padding:1rem}
.table{overflow:auto} table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid #d2dde5;padding:.6rem;text-align:left;vertical-align:top}
input{display:block;box-sizing:border-box;max-width:100%;width:22rem;padding:.5rem;margin:.15rem 0 .9rem;border:1px solid #6d879a;border-radius:.25rem;font:inherit}
:focus-visible{outline:3px solid #e69518;outline-offset:2px} .muted{color:#486578} .errorlist{color:#8d2020}
</style></head><body>
<header><strong>Reparos SJC · Testes</strong>{% block logout %}{% endblock %}</header><main>{% block body %}{% endblock %}</main>
</body></html>
